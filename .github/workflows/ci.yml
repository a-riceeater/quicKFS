name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      # ShellCheck and systemd-analyze are both preinstalled on the Ubuntu
      # runner. The packaging test suite (run from `cargo test` below) skips
      # them when absent, so running them explicitly here keeps a missing tool
      # from turning into a silently skipped check.
      - name: ShellCheck the packaging scripts
        run: shellcheck -s sh packaging/install.sh packaging/uninstall.sh packaging/tests/run.sh

      # `systemd-analyze verify` resolves User=, Group= and the ExecStart
      # program, so the unit is checked against a runner that actually has
      # them. Both are throwaway on a CI machine and neither is used to run
      # anything.
      - name: Verify the systemd unit
        run: |
          set -eu
          sudo groupadd --system --force quickfs
          id quickfs >/dev/null 2>&1 || sudo useradd --system --gid quickfs \
            --home-dir /var/lib/quickfs --no-create-home --shell /usr/sbin/nologin quickfs
          sudo install -m 0755 /bin/true /usr/local/bin/quickfs-server-daemon
          systemd-analyze verify packaging/systemd/quickfs-server.service
          sudo rm -f /usr/local/bin/quickfs-server-daemon

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Build documentation
        run: cargo doc --workspace --no-deps

  windows:
    name: Windows CI
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      # The runner has no WinFsp installation, and installing the driver needs
      # more than the build does. An administrative extract of the MSI gives the
      # headers and import library the link step wants, which is what
      # WINFSP_INSTALL_DIR exists for. Mounting is not exercised here; that
      # needs the driver and is covered by the manual plan in
      # docs/windows-integration-tests.md.
      - name: Unpack the WinFsp SDK
        shell: pwsh
        run: |
          $version = "2.0.23075"
          $msi = "$env:RUNNER_TEMP\winfsp.msi"
          Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-$version.msi" -OutFile $msi
          $target = "$env:RUNNER_TEMP\winfsp-sdk"
          Start-Process msiexec.exe -ArgumentList "/a","`"$msi`"","/qn","TARGETDIR=`"$target`"" -Wait -NoNewWindow
          $sdk = Join-Path $target "DYNAMIC"
          if (-not (Test-Path (Join-Path $sdk "lib\winfsp-x64.lib"))) {
            throw "the WinFsp SDK did not unpack as expected"
          }
          "WINFSP_INSTALL_DIR=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Scoped to what Windows actually builds. `server-core` and the daemon
      # are largely cfg(unix), so a whole-workspace lint here would fail on
      # dead-code warnings for Linux-only server code that the Linux job
      # already checks properly.
      - name: Run Clippy
        run: >
          cargo clippy --all-targets
          -p quickfs-protocol
          -p quickfs-auth
          -p quickfs-cache
          -p quickfs-common
          -p quickfs-client-core
          -p quickfs-fs-adapter
          -p quickfs-transport-quic
          -p quickfs-windows-support
          -p quickfs-filesystem-winfsp
          -p quickfs-windows-cli
          -p quickfs-filesystem-macfuse
          -p quickfs-client-cli
          -- -D warnings

      # Same scope, and for the same reason: most server tests report
      # NotSupported on Windows and are covered by the Linux job.
      - name: Test Windows client
        run: >
          cargo test
          -p quickfs-protocol
          -p quickfs-auth
          -p quickfs-cache
          -p quickfs-common
          -p quickfs-client-core
          -p quickfs-fs-adapter
          -p quickfs-transport-quic
          -p quickfs-windows-support
          -p quickfs-filesystem-winfsp
          -p quickfs-windows-cli

      - name: Build the Windows client
        run: cargo build --release -p quickfs-windows-cli

  macos:
    name: macOS CI
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Test macOS client
        run: cargo test -p quickfs-client-cli -p quickfs-filesystem-macfuse -p quickfs-fs-adapter
