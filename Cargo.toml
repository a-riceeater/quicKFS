[workspace]
resolver = "2"
members = [
  "crates/*",
  "clients/macos/client-cli",
  "clients/macos/client-gui/src-tauri",
  "clients/macos/filesystem-macfuse",
  "clients/windows/client-cli",
  "clients/windows/filesystem-winfsp",
  "servers/linux/server-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/quickfs/quickfs"
publish = false

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
futures = "0.3"
fuser = "0.17"
hex = "0.4"
hmac = "0.13"
postcard = { version = "1", default-features = false, features = ["alloc"] }
quinn = "0.11"
rcgen = "0.14"
rpassword = "7"
rustix = { version = "1", features = ["process"] }
rustls = "0.23"
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The "asm" backend does not assemble under MSVC; crates that want it opt in
# through a `cfg(not(target_env = "msvc"))` target dependency instead.
sha2 = { version = "0.10" }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
widestring = "1"
winfsp_wrs = "0.4"
zeroize = { version = "1", features = ["derive"] }
zstd = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[patch.crates-io]
# The published winfsp_wrs_sys build script resolves the WinFsp import library
# only through the machine-wide HKLM install key. The vendored copy also accepts
# WINFSP_INSTALL_DIR / WINFSP_LIB_DIR so CI runners and unprivileged developer
# machines can build against an unpacked SDK.
winfsp_wrs_sys = { path = "vendor/winfsp_wrs_sys" }
# fuser 0.17 calls libfuse's obsolete API-25 mount entry point on macOS.
# macFUSE 5.3 requires the current channel-based mount API instead.
fuser = { path = "vendor/fuser" }
